<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel - Uber</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="painel-page">

    <header>

        <h1>Uber</h1>

        <a href="index.html">
            Sair
        </a>

    </header>


    <main>

        <section class="boas-vindas">

            <h2 id="ola"></h2>


            <p>
                Bem-vinda ao seu painel.
            </p>

        </section>


        <section class="cards">

            <div class="card">

                <h3>
                    Corridas hoje
                </h3>

                <p>
                    8
                </p>

            </div>


            <div class="card">

                <h3>
                    Ganhos hoje
                </h3>

                <p>
                    R$ 185,00
                </p>

            </div>


            <div class="card">

                <h3>
                    Avaliação
                </h3>

                <p>
                    4,9 ⭐
                </p>

            </div>

        </section>


        <section class="corridas">

            <h2>
                Últimas corridas
            </h2>


            <div class="corrida">

                <div>

                    <strong>
                        Centro → Savassi
                    </strong>

                    <p>
                        Hoje - 08:30
                    </p>

                </div>

                <div class="valor">
                    R$ 25,00
                </div>

            </div>


            <div class="corrida">

                <div>

                    <strong>
                        Savassi → Pampulha
                    </strong>

                    <p>
                        Hoje - 10:15
                    </p>

                </div>

                <div class="valor">
                    R$ 32,00
                </div>

            </div>


            <div class="corrida">

                <div>

                    <strong>
                        Pampulha → Centro
                    </strong>

                    <p>
                        Hoje - 12:40
                    </p>

                </div>

                <div class="valor">
                    R$ 28,00
                </div>

            </div>


            <div class="corrida">

                <div>

                    <strong>
                        Centro → Lourdes
                    </strong>

                    <p>
                        Hoje - 14:20
                    </p>

                </div>

                <div class="valor">
                    R$ 21,00
                </div>

            </div>

        </section>

    </main>
    <script>
        if (sessionStorage.getItem("logado") !== "true") {
            window.location.href = "index.html";
        }

        document.getElementById("ola").innerText =
            "Olá, " + sessionStorage.getItem("nome") + "!";
    </script>
</body>

</html>
